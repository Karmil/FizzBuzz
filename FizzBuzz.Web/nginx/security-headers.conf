# Included in every location: a location defining its own add_header does not inherit the server ones.
# 'unsafe-inline' for styles is required by Angular component styles injected at runtime;
# scripts are restricted to same-origin files (critical CSS inlining is disabled in angular.json).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
